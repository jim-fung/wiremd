name: Publish to npm

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Run tests
        run: bun run test

      # Note: bun publish does not support npm's --provenance attestations yet
      # (https://github.com/oven-sh/bun/issues/15601).
      - name: Publish to npm
        run: |
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > "$HOME/.npmrc"
          bun publish
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Package wireframe skill for Claude Desktop / Cowork upload
        run: bun run skill:zip

      - name: Attach skill zip to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: wireframe-skill.zip
